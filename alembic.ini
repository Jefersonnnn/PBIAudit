# Alembic Configuration File
# This file contains the configuration settings for Alembic database migrations

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Pattern used to detect migration files
sqlalchemy.url = postgresql+psycopg2://powerbi_user:password@localhost:5432/powerbi_governance

# sys.path path separator
# This points to the current directory so that it can find the application
# path_to_repository = 

# Whether to run migrations in bulk or one at a time
sqlalchemy.future = true

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
